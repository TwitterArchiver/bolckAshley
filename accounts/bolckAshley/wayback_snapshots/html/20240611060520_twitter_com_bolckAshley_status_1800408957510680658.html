  為啥社民黨人會用“二共”而非“中修”，“中帝”的說法呢？
  <br/>
  <br/>
  首先就是文革之後的🇨🇳發生了大變化，所以把文革之前的🇨🇳稱為“第一共和國”，而把之後的🇨🇳稱為“第二共和國”這是很有道理的。
  <br/>
  <br/>
  其次就是自從列斯開始隨便亂用“修正主義”這詞，把它當帽子扣之後，這個詞彙就基本上變成一個主觀的評價而非客觀了。
